{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section>
  <h2>Change password</h2>
  <p>Choose a new password of 12 to 128 characters.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Current password
      <input type="password" name="current_password" maxlength="128"
             autocomplete="current-password" required>
    </label>
    <label>New password
      <input type="password" name="new_password" minlength="12" maxlength="128"
             autocomplete="new-password" required>
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" minlength="12" maxlength="128"
             autocomplete="new-password" required>
    </label>
    <button type="submit">Save new password</button>
  </form>
</section>
{% endblock %}
