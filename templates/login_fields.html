  {% if error %}<p class="error" role="alert">Invalid username or password.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username <input name="username" maxlength="64" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" maxlength="128"
                           autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
